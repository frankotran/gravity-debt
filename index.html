<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>GRAVITY DEBT — every flip costs</title>
<meta name="description" content="A one-tap gravity-flip arcade game. Every flip costs energy. How long can you survive?">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="timer">0:00</div>
  <div id="pace"></div>
  <div id="energy-wrap">
    <div id="energy-label">FLIPS</div>
    <div id="energy-pips"></div>
  </div>
  <div id="best-hud">BEST 0</div>
  <div id="combo"><span id="combo-txt">COMBO x2</span><div id="combo-barwrap"><div id="combo-bar"></div></div></div>
</div>

<!-- Menu -->
<div id="menu" class="overlay">
  <div class="panel">
    <div class="title-glitch">GRAVITY<br>DEBT</div>
    <div class="tagline">every flip costs.</div>
    <div class="howto">
      <div><span class="key">TAP</span> / <span class="key">SPACE</span> flip gravity</div>
      <div class="dim">Grab <span class="orb-word">orbs</span> to recharge &mdash; run dry and you're stuck.</div>
      <div class="dim">Hit a <span style="color:#7df9ff;font-weight:700">bounce pad</span> mid-flip to spring back home.</div>
    </div>
    <button id="start-btn" class="btn">TAP TO START</button>
    <div id="menu-best" class="best-line">BEST 0</div>
    <div id="ach-line" class="best-line dim">TROPHIES 0/10</div>
  </div>
</div>

<!-- Game over -->
<div id="gameover" class="overlay hidden">
  <div class="panel">
    <div class="go-title">OUT OF MOVES</div>
    <div id="newbest" class="newbest hidden">NEW BEST</div>
    <div id="final-score" class="final-score">0</div>
    <div class="stats">
      <div><span id="st-time">0s</span><label>survived</label></div>
      <div><span id="st-flips">0</span><label>flips</label></div>
      <div><span id="st-orbs">0</span><label>orbs</label></div>
      <div><span id="st-near">0</span><label>near miss</label></div>
    </div>
    <div class="btn-row">
      <button id="retry-btn" class="btn">RETRY</button>
      <button id="share-btn" class="btn ghost">SHARE</button>
    </div>
    <div id="share-note" class="share-note hidden">score copied — go flex it</div>
  </div>
</div>

<!-- Pause -->
<div id="paused" class="overlay hidden">
  <div class="panel small">
    <div class="go-title">PAUSED</div>
    <button id="resume-btn" class="btn">RESUME</button>
  </div>
</div>

<button id="mute-btn" class="icon-btn" aria-label="toggle sound">SOUND ON</button>

<script src="game.js"></script>
</body>
</html>
